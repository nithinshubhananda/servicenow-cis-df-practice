<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIS-DF Practice Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ink: #14181C;
    --ink-panel: #1C2126;
    --ink-line: #2B3138;
    --paper: #F6F4EF;
    --panel: #FFFFFF;
    --line: #DAD6CC;
    --text: #1B1F23;
    --text-muted: #6B6860;
    --text-dim: #9B9890;
    --signal: #0E7C86;
    --signal-strong: #0A5C64;
    --signal-tint: #E4F1F1;
    --amber: #B5750F;
    --amber-tint: #F7ECD9;
    --good: #2F7D4F;
    --good-tint: #E5F3EA;
    --bad: #B23A2E;
    --bad-tint: #FBEAE8;
    --radius: 3px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181C;
      --panel: #1C2126;
      --line: #2B3138;
      --text: #E8E6E0;
      --text-muted: #A6A399;
      --text-dim: #706D65;
      --signal-tint: #16302F;
      --amber-tint: #2B2213;
      --good-tint: #16281D;
      --bad-tint: #2B1A18;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181C;
    --panel: #1C2126;
    --line: #2B3138;
    --text: #E8E6E0;
    --text-muted: #A6A399;
    --text-dim: #706D65;
    --signal-tint: #16302F;
    --amber-tint: #2B2213;
    --good-tint: #16281D;
    --bad-tint: #2B1A18;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  a { color: var(--signal); }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--ink);
    color: #F0EEE8;
    padding: 56px 24px 40px;
    border-bottom: 1px solid var(--ink-line);
  }
  .hero-inner { max-width: 760px; margin: 0 auto; }
  .hero h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 600;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  .hero p {
    color: #B7B4AC;
    font-size: 16px;
    max-width: 56ch;
    margin: 0 0 28px;
  }
  .domain-bar {
    display: flex;
    height: 34px;
    border: 1px solid #3A4046;
    overflow: hidden;
  }
  .domain-bar > div {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #14181C;
    white-space: nowrap;
    overflow: hidden;
  }
  .domain-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #9B9890;
  }
  .domain-legend span.sw {
    display: inline-block;
    width: 9px; height: 9px;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* ---------- Layout wrapper ---------- */
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }

  /* ---------- Set selection panels ---------- */
  .sets { display: grid; gap: 14px; margin-top: 8px; }
  .set-panel {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 22px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .set-panel .info h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .set-panel .info p { margin: 0; color: var(--text-muted); font-size: 13.5px; }
  .set-panel .best {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 20px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    background: var(--signal);
    color: #fff;
    transition: background .15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--signal-strong); }
  .btn:disabled { background: var(--line); color: var(--text-dim); cursor: not-allowed; }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--line);
  }
  .btn.secondary:hover { border-color: var(--text-dim); background: transparent; }

  .note {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ---------- Quiz screen ---------- */
  .quiz-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .progress-ticks {
    display: flex;
    gap: 3px;
    flex: 1;
    min-width: 160px;
  }
  .progress-ticks .tick {
    height: 5px;
    flex: 1;
    background: var(--line);
  }
  .progress-ticks .tick.done { background: var(--signal); }
  .progress-ticks .tick.current { background: var(--amber); }
  .q-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    align-items: center;
    white-space: nowrap;
  }
  .domain-tag {
    display: inline-block;
    padding: 3px 8px;
    background: var(--signal-tint);
    color: var(--signal-strong);
    font-size: 11px;
    font-weight: 600;
  }
  :root[data-theme="dark"] .domain-tag,
  @media (prefers-color-scheme: dark) { .domain-tag { color: #6FCBD1; } }

  .q-card {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 28px 26px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.45;
    margin: 0 0 20px;
  }
  .q-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    margin: -12px 0 18px;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    cursor: pointer;
    font-size: 15px;
    transition: border-color .1s ease, background .1s ease;
  }
  .opt:hover { border-color: var(--text-dim); }
  .opt .mark {
    flex: 0 0 auto;
    width: 16px; height: 16px;
    border: 1.5px solid var(--text-dim);
    margin-top: 2px;
    position: relative;
  }
  .opt.radio .mark { border-radius: 50%; }
  .opt.checkbox .mark { border-radius: 2px; }
  .opt.selected { border-color: var(--signal); background: var(--signal-tint); }
  .opt.selected .mark { border-color: var(--signal); background: var(--signal); }
  .opt.radio.selected .mark::after {
    content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #fff;
  }
  .opt.checkbox.selected .mark::after {
    content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(40deg);
  }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    gap: 10px;
  }

  /* ---------- Timer & pause ---------- */
  .timer-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .timer-display {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    letter-spacing: 0.03em;
  }
  .timer-display.timer-warn { color: var(--amber); border-color: var(--amber); }
  .timer-display.timer-danger { color: var(--bad); border-color: var(--bad); }
  .small-btn { padding: 8px 14px; font-size: 12.5px; }

  /* ---------- Flag for review ---------- */
  .q-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 20px;
  }
  .flag-btn {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .flag-btn.flagged { border-color: var(--amber); color: var(--amber); background: var(--amber-tint); }

  /* ---------- Review grid ---------- */
  .review-grid-legend {
    display: flex;
    gap: 18px;
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 10px 0 18px;
    flex-wrap: wrap;
  }
  .legend-dot {
    display: inline-block;
    width: 10px; height: 10px;
    margin-right: 5px;
    vertical-align: middle;
    border: 1px solid var(--line);
  }
  .legend-answered { background: var(--signal); border-color: var(--signal); }
  .legend-unanswered { background: var(--panel); }
  .legend-flagged { background: var(--amber-tint); border-color: var(--amber); }
  .review-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 6px;
    margin-bottom: 30px;
  }
  .grid-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 0;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-muted);
    cursor: pointer;
  }
  .grid-cell.answered { background: var(--signal-tint); color: var(--signal-strong); border-color: var(--signal); }
  .grid-cell.cell-flagged { box-shadow: inset 0 0 0 2px var(--amber); }

  /* ---------- Feedback form ---------- */
  .feedback-card {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 24px 26px;
    margin-top: 36px;
  }
  .star-row { display: flex; gap: 6px; margin: 10px 0 18px; }
  .star-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
  }
  .star-btn.on { background: var(--amber-tint); border-color: var(--amber); color: var(--amber); }
  .feedback-card textarea {
    width: 100%;
    min-height: 90px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    border-radius: var(--radius);
    resize: vertical;
  }

  /* ---------- Comments showcase (landing page) ---------- */
  .comments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 34px;
  }
  .comment-card {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 18px 18px;
  }
  .comment-stars { color: var(--amber); font-size: 13px; margin-bottom: 8px; }
  .comment-text { font-size: 14px; line-height: 1.5; margin: 0 0 10px; font-style: italic; }
  .comment-author { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); margin: 0; }

  /* ---------- Admin moderation controls ---------- */
  .mod-toggle-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .switch {
    position: relative;
    width: 40px; height: 22px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: var(--line);
    cursor: pointer;
    transition: background .15s;
  }
  .switch-track::before {
    content: '';
    position: absolute; left: 3px; top: 3px;
    width: 16px; height: 16px;
    background: #fff;
    transition: transform .15s;
  }
  .switch input:checked + .switch-track { background: var(--good); }
  .switch input:checked + .switch-track::before { transform: translateX(18px); }
  .mod-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text-muted);
    cursor: pointer;
  }
  .mod-btn.on { border-color: var(--good); color: var(--good); background: var(--good-tint); }

  /* ---------- Results ---------- */
  .score-block {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 28px 26px;
    margin-bottom: 24px;
  }
  .score-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
  }
  .score-pct { font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); font-size: 15px; margin-top: 6px; }
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 10px;
    display: inline-block;
  }
  .badge.pass { background: var(--good-tint); color: var(--good); }
  .badge.fail { background: var(--bad-tint); color: var(--bad); }

  .domain-scores { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .dscore-row { display: grid; grid-template-columns: 140px 1fr 56px; align-items: center; gap: 12px; }
  .dscore-row .dlabel { font-size: 13.5px; color: var(--text-muted); }
  .dscore-track { height: 8px; background: var(--line); position: relative; }
  .dscore-fill { height: 100%; background: var(--signal); }
  .dscore-val { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; text-align: right; color: var(--text-muted); }

  .review-item {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 20px 22px;
    margin-bottom: 10px;
  }
  .review-item.wrong { border-left: 3px solid var(--bad); }
  .review-item.right { border-left: 3px solid var(--good); }
  .review-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .review-q { font-weight: 500; font-size: 15.5px; margin: 0 0 12px; }
  .review-ans { font-size: 13.5px; margin: 4px 0; }
  .review-ans .lbl { color: var(--text-muted); }
  .review-ans .val.wrong-val { color: var(--bad); }
  .review-ans .val.right-val { color: var(--good); }
  .review-explain {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.55;
  }
  .review-explain strong { color: var(--text); }
  .review-doclink { margin-top: 8px; }
  .review-doclink a { font-size: 12px; color: var(--signal); text-decoration: none; }
  .review-doclink a:hover { text-decoration: underline; }

  h2.section-title { font-size: 15px; text-transform: none; margin: 36px 0 14px; font-weight: 600; }

  footer.page-foot {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 50px;
  }

  .top-actions { display: flex; gap: 10px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }

  /* ---------- Registration form ---------- */
  .reg-card {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 32px 28px;
    max-width: 460px;
    margin: 0 auto;
  }
  .reg-card h2 { margin: 0 0 6px; font-size: 21px; font-weight: 600; }
  .reg-card .sub { color: var(--text-muted); font-size: 13.5px; margin: 0 0 24px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: none;
  }
  .field input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    border-radius: var(--radius);
  }
  .field input:focus { outline: 2px solid var(--signal); outline-offset: -1px; border-color: var(--signal); }
  .field .err { color: var(--bad); font-size: 12px; margin-top: 5px; display: none; }
  .field.invalid input { border-color: var(--bad); }
  .field.invalid .err { display: block; }
  .reg-privacy {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 18px;
    line-height: 1.5;
  }

  /* ---------- Admin panel ---------- */
  .admin-link {
    text-align: center;
    margin-top: 30px;
  }
  .admin-link button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  table.admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 16px;
  }
  table.admin-table th, table.admin-table td {
    border: 1px solid var(--line);
    padding: 8px 10px;
    text-align: left;
  }
  table.admin-table th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    background: var(--panel);
  }
  .admin-note { color: var(--text-dim); font-size: 12.5px; margin-top: 14px; }
  .admin-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* =========================================================
     RESPONSIVE — tablet/phone breakpoints. Desktop styles above
     are the baseline; these adjust density and layout as the
     viewport narrows so the same page works well on a laptop,
     a tablet, or a phone in either orientation.
     ========================================================= */

  /* Tablet & large phones (landscape) */
  @media (max-width: 760px) {
    .wrap { padding-left: 18px; padding-right: 18px; }
    .hero { padding: 40px 18px 30px; }
    .hero h1 { font-size: 26px; }
    .domain-legend { gap: 4px 12px; font-size: 11px; }
  }

  /* Phones (portrait) */
  @media (max-width: 640px) {
    .hero { padding: 32px 16px 24px; }
    .wrap { padding-top: 24px; padding-left: 16px; padding-right: 16px; }
    .set-panel { flex-direction: column; align-items: stretch; gap: 12px; padding: 18px; }
    .set-panel .btn { width: 100%; }

    /* Timer bar: keep the clock and Pause together, let Review wrap to its own row if needed */
    .timer-bar { gap: 8px; }
    .timer-display { font-size: 18px; padding: 5px 10px; }
    .small-btn { padding: 8px 12px; font-size: 12px; }

    /* Question card: flag button drops below the question text instead of squeezing beside it */
    .q-card { padding: 20px 16px; }
    .q-card-head { flex-direction: column; align-items: flex-start; gap: 10px; }
    .flag-btn { align-self: flex-start; }
    .q-text { font-size: 16.5px; }
    .opt { padding: 14px 14px; font-size: 14.5px; } /* slightly taller tap target for touch */

    /* Nav buttons: full-width and stacked, easier to tap accurately than small side-by-side buttons */
    .quiz-nav { flex-direction: column-reverse; }
    .quiz-nav .btn { width: 100%; }
    .top-actions { flex-direction: column; }
    .top-actions .btn { width: 100%; }

    /* Review grid: slightly smaller cells so more fit per row on a narrow screen */
    .review-grid { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
    .review-grid-legend { gap: 10px 16px; font-size: 11.5px; }

    .score-block { flex-direction: column; align-items: flex-start; gap: 12px; }
    .score-num { font-size: 36px; }
    .dscore-row { grid-template-columns: 96px 1fr 44px; gap: 8px; }

    .reg-card { padding: 24px 20px; }

    .star-row { justify-content: center; }
    .feedback-card { padding: 20px 18px; }

    /* Admin tables scroll horizontally rather than squeezing columns unreadably */
    table.admin-table { font-size: 12px; min-width: 560px; }
  }

  /* Small phones */
  @media (max-width: 400px) {
    .hero h1 { font-size: 22px; }
    .domain-bar { height: 28px; }
    .domain-bar > div { font-size: 10px; }
    .review-grid { grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); }
    .grid-cell { padding: 8px 0; font-size: 12px; }
    .timer-display { font-size: 16px; }
    .q-text { font-size: 15.5px; }
  }

  /* Larger desktop screens: a little extra breathing room, not just a wider centered column */
  @media (min-width: 1200px) {
    .wrap { max-width: 820px; }
    .q-text { font-size: 19px; }
  }

  /* Respect reduced-motion preferences */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  timeLeft: 0, paused: false, flags: [], reviewMode: false, examEndsAt: null, pausedAt: null };

const EXAM_DURATION_SECONDS = 90 * 60; // 90 minutes, matching the real CIS-DF exam
const PROGRESS_KEY = 'cisdf_inprogress_v1';
let timerInterval = null;

/* ---------- Progress persistence: survives reloads, tab closes, and republishes ---------- */
function saveProgress() {
  if (state.screen !== 'quiz' && state.screen !== 'review') return;
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({
      setKey: state.setKey, qIndex: state.qIndex, answers: state.answers, flags: state.flags,
      registrant: state.registrant, attemptId: state.attemptId,
      examEndsAt: state.examEndsAt, pausedAt: state.pausedAt,
      savedAt: Date.now()
    }));
  } catch (e) {}
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {}
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function computeTimeLeft() {
  if (state.pausedAt) return Math.max(0, Math.round((state.examEndsAt - state.pausedAt) / 1000));
  return Math.max(0, Math.round((state.examEndsAt - Date.now()) / 1000));
}
function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    state.timeLeft = computeTimeLeft();
    if (state.paused) return;
    if (state.timeLeft <= 0) {
      stopTimer();
      // time's up — auto-submit whatever has been answered so far
      state.screen = 'results';
      render();
      return;
    }
    saveProgress();
    // update just the timer display without a full re-render, to avoid disrupting typing/focus
    const timerEl = document.getElementById('timerDisplay');
    if (timerEl) {
      timerEl.textContent = formatTime(state.timeLeft);
      timerEl.classList.toggle('timer-warn', state.timeLeft <= 15 * 60 && state.timeLeft > 5 * 60);
      timerEl.classList.toggle('timer-danger', state.timeLeft <= 5 * 60);
    }
  }, 1000);
}
function formatTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/* =========================================================
   UNIVERSAL SILENT TRACKING — Google Apps Script logger
   Works for absolutely anyone, any hosting, any account
   status, with zero extra screens or clicks beyond the
   normal exam flow. Fires in the background at each key
   moment; never blocks or interrupts the person using the app.

const SHEET_LOG_URL = 'https://script.google.com/macros/s/AKfycbzwkO-3Q4b2aJ_zlYcZnypJ0V1DuWvEwHa6RSoL1fc3yO8LDQe0HMMrIC3TN46HujCX/exec';

// Returns a Promise<boolean> so callers that need to confirm delivery (like the
// feedback button) can show the person a real result instead of assuming success.
// Also logs to the browser console either way, so it's inspectable via DevTools.
function logEvent(event, data) {
  return fetch(SHEET_LOG_URL, {
    method: 'POST',
    // No `mode: 'no-cors'` here on purpose — that mode makes the response
    // opaque, so we could never tell a real failure from a real success.
    // text/plain keeps this a CORS "simple request" (no preflight needed)
    // while still letting us read the actual result back.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ event, ...data }),
  }).then((res) => {
    if (!res.ok) { console.warn('[CIS-DF logger] non-OK response for', event, res.status); return false; }
    console.log('[CIS-DF logger] logged', event);
    return true;
  }).catch((err) => {
    console.warn('[CIS-DF logger] request failed for', event, err);
    return false;
  });
}

function domainSummary(domainTally) {
  return Object.entries(domainTally || {}).map(([d, v]) => `${d} ${v.correct}/${v.total}`).join('; ');
}

async function fetchApprovedComments() {

    if (!res.ok) return [];

  } catch (e) { return []; } // network hiccup, blocked context, or nothing approved yet — fail quietly
}

function buildResultsPDF(payload) {
  const { registrant, setName, score, total, pct, passed, domainTally, reviewData } = payload;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const marginX = 48;
  let y = 56;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
  doc.text('CIS-DF Practice Exam Results', marginX, y); y += 26;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
  doc.text(`Name: ${registrant ? registrant.firstName + ' ' + registrant.lastName : 'N/A'}`, marginX, y); y += 16;
  doc.text(`Email: ${registrant ? registrant.email : 'N/A'}`, marginX, y); y += 16;
  doc.text(`Exam set: ${setName}`, marginX, y); y += 16;
  doc.text(`Date: ${new Date().toLocaleString()}`, marginX, y); y += 26;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
  doc.text(`Score: ${score} / ${total}  (${pct}%)  —  ${passed ? 'PASS' : 'BELOW PASS MARK'}`, marginX, y); y += 12;
  doc.setDrawColor(passed ? 47 : 178, passed ? 125 : 58, passed ? 79 : 46);
  doc.setLineWidth(2); doc.line(marginX, y, 547, y); y += 26;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.text('Score by domain', marginX, y); y += 18;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
  Object.entries(domainTally).forEach(([d, v]) => {
    const p = Math.round((v.correct / v.total) * 100);
    doc.text(`${d}`, marginX, y);
    doc.text(`${v.correct} / ${v.total}  (${p}%)`, 400, y);
    y += 16;
  });
  y += 14;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.text('Questions missed (see the practice site for full explanations)', marginX, y); y += 18;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  const missed = reviewData.filter(r => !r.correct);
  if (!missed.length) {
    doc.text('None — perfect score.', marginX, y); y += 14;
  } else {
    missed.forEach(r => {
      if (y > 760) { doc.addPage(); y = 56; }
      const qLine = `Q${r.i + 1} [${r.domain}]: ${r.q}`;
      const wrapped = doc.splitTextToSize(qLine, 500);
      doc.text(wrapped, marginX, y); y += wrapped.length * 12;
      doc.setTextColor(178, 58, 46);
      const yourLine = doc.splitTextToSize(`Your answer: ${r.userText}`, 500);
      doc.text(yourLine, marginX, y); y += yourLine.length * 12;
      doc.setTextColor(47, 125, 79);
      const correctLine = doc.splitTextToSize(`Correct: ${r.correctText}`, 500);
      doc.text(correctLine, marginX, y); y += correctLine.length * 12;
      doc.setTextColor(0, 0, 0);
      if (r.doc) {
        doc.setFontSize(8.5);
        doc.setTextColor(14, 124, 134);
        const refLine = doc.splitTextToSize(`Reference: ${r.doc.label} — ${r.doc.url}`, 500);
        doc.text(refLine, marginX, y); y += refLine.length * 11;
        doc.setFontSize(9.5);
        doc.setTextColor(0, 0, 0);
      }
      y += 8;
    });
  }
  return doc.output('blob');
}

            '</td><td>' + (d.startedAt ? new Date(d.startedAt).toLocaleString() : '') + '</td><td>' + downloadStr + '</td></tr>';
        }).join('');
        body.innerHTML = '<p class="admin-note">' + rows.length + ' attempt(s) recorded. Visible only to you as the artifact owner.</p>' +
          '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Set</th><th>Status</th><th>Score</th><th>Started</th><th>PDF downloaded?</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
      }
    } catch (e) {
      body.innerHTML = '<p class="admin-note">Could not load submissions right now (' + (e && e.code ? e.code : 'unknown error') + ').</p>';
    }

    loadFeedbackList();
  })();
}

function renderQuiz() {
  const set = EXAM_SETS[state.setKey];
  const total = set.questions.length;
  const q = set.questions[state.qIndex];
  const selected = state.answers[state.qIndex] || [];
  const flagged = state.flags[state.qIndex];

  if (state.paused) {
    app.innerHTML = `
      <div class="wrap" style="padding-top:80px; text-align:center;">
        <div class="q-card" style="max-width:420px; margin:0 auto;">
          <h2 style="margin-top:0;">Exam paused</h2>
          <p style="color:var(--text-muted); font-size:14px; line-height:1.6;">
            The timer is stopped. Note: this pause option is provided for practice convenience only &mdash;
            the real CIS-DF exam via Pearson VUE/OnVUE does <strong>not</strong> allow pausing once started; its clock runs continuously.
          </p>
          <div class="score-num" style="font-size:32px; margin:16px 0;">${formatTime(state.timeLeft)}</div>
          <button class="btn" id="resumeBtn" style="width:100%;">Resume exam</button>
        </div>
      </div>`;
    document.getElementById('resumeBtn').addEventListener('click', () => {
      // shift examEndsAt forward by however long the pause lasted, so paused time isn't counted against the clock
      const pausedDurationMs = Date.now() - state.pausedAt;
      state.examEndsAt += pausedDurationMs;
      state.pausedAt = null;
      state.paused = false;
      startTimer();
      saveProgress();
      renderQuiz();
    });
    return;
  }

  const ticks = set.questions.map((_, i) => {
    let cls = 'tick';
    if (i < state.qIndex) cls += ' done';
    else if (i === state.qIndex) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  const optType = q.type === 'multi' ? 'checkbox' : 'radio';
  const optionsHtml = q.options.map((opt, i) => {
    const isSel = selected.includes(i);
    return `<div class="opt ${optType} ${isSel ? 'selected' : ''}" data-idx="${i}">
      <div class="mark"></div><div>${opt}</div>
    </div>`;
  }).join('');

  const requiredCount = q.correct.length;
  const hint = q.type === 'multi'
    ? `<div class="q-hint">Select exactly ${requiredCount} answer${requiredCount > 1 ? 's' : ''} &mdash; you have selected ${selected.length} of ${requiredCount}</div>`
    : '';
  const canProceed = q.type === 'multi' ? selected.length === requiredCount : selected.length === 1;
  const isLast = state.qIndex === total - 1;
  const timerClass = state.timeLeft <= 5*60 ? 'timer-danger' : (state.timeLeft <= 15*60 ? 'timer-warn' : '');

  app.innerHTML = `
    <div class="wrap" style="padding-top:24px;">
      <div class="timer-bar">
        <div id="timerDisplay" class="timer-display ${timerClass}">${formatTime(state.timeLeft)}</div>
        <button class="btn secondary small-btn" id="pauseBtn">Pause</button>
        <button class="btn secondary small-btn" id="reviewGridBtn">Review</button>
      </div>
      <div class="quiz-top">
        <div class="progress-ticks">${ticks}</div>
        <div class="q-meta"><span class="domain-tag">${q.domain}</span><span>Q${state.qIndex + 1} / ${total}</span></div>
      </div>
      <div class="q-card">
        <div class="q-card-head">
          <p class="q-text" style="margin-bottom:0;">${q.q}</p>
          <button class="flag-btn ${flagged ? 'flagged' : ''}" id="flagBtn" title="Flag for review">${flagged ? '&#9873; Flagged' : '&#9872; Flag for review'}</button>
        </div>
        ${hint}
        <div class="options">${optionsHtml}</div>
      </div>
      <div class="quiz-nav">
        <button class="btn secondary" id="backBtn" ${state.qIndex === 0 ? 'disabled' : ''}>Back</button>
        <button class="btn" id="nextBtn" ${canProceed ? '' : 'disabled'}>${isLast ? 'Review & submit' : 'Next question'}</button>
      </div>
    </div>`;

  app.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      let cur = state.answers[state.qIndex] || [];
      if (q.type === 'multi') {
        if (cur.includes(idx)) {
          cur = cur.filter(x => x !== idx);
        } else if (cur.length < requiredCount) {
          cur = [...cur, idx];
        }
        // if already at the required count and a new option is clicked, ignore it
        // until the person deselects one first — keeps the "select exactly N" rule clear
      } else {
        cur = [idx];
      }
      state.answers[state.qIndex] = cur;
      saveProgress();
      renderQuiz();
    });
  });
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { state.qIndex--; saveProgress(); renderQuiz(); window.scrollTo(0,0); });
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    if (isLast) { state.reviewMode = true; state.screen = 'review'; saveProgress(); render(); window.scrollTo(0,0); }
    else { state.qIndex++; saveProgress(); renderQuiz(); window.scrollTo(0,0); }
  });
  document.getElementById('pauseBtn').addEventListener('click', () => {
    state.paused = true;
    state.pausedAt = Date.now();
    stopTimer();
    saveProgress();
    renderQuiz();
  });
  document.getElementById('flagBtn').addEventListener('click', () => {
    state.flags[state.qIndex] = !state.flags[state.qIndex];
    saveProgress();
    renderQuiz();
  });
  document.getElementById('reviewGridBtn').addEventListener('click', () => {
    state.screen = 'review'; saveProgress(); render(); window.scrollTo(0,0);
  });
}

function renderReviewGrid() {
  const set = EXAM_SETS[state.setKey];
  const total = set.questions.length;
  const unanswered = state.answers.filter(a => !a || a.length === 0).length;
  const flaggedCount = state.flags.filter(Boolean).length;

  const cells = set.questions.map((q, i) => {
    const answered = state.answers[i] && state.answers[i].length > 0;
    const flagged = state.flags[i];
    let cls = 'grid-cell';
    if (answered) cls += ' answered';
    if (flagged) cls += ' cell-flagged';
    return `<button class="${cls}" data-jump="${i}">${i + 1}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="wrap" style="padding-top:32px;">
      <div class="timer-bar" style="margin-bottom:24px;">
        <div id="timerDisplay" class="timer-display ${state.timeLeft <= 5*60 ? 'timer-danger' : (state.timeLeft <= 15*60 ? 'timer-warn' : '')}">${formatTime(state.timeLeft)}</div>
        <button class="btn secondary small-btn" id="pauseBtn2">Pause</button>
      </div>
      <h2 class="section-title" style="margin-top:0;">Review before you submit</h2>
      <p style="color:var(--text-muted); font-size:14px;">${unanswered} unanswered &middot; ${flaggedCount} flagged for review. Click any question number to jump to it.</p>
      <div class="review-grid-legend">
        <span><span class="legend-dot legend-answered"></span> Answered</span>
        <span><span class="legend-dot legend-unanswered"></span> Unanswered</span>
        <span><span class="legend-dot legend-flagged"></span> Flagged</span>
      </div>
      <div class="review-grid">${cells}</div>
      <div class="top-actions">
        <button class="btn secondary" id="backToQuizBtn">Back to exam</button>
        <button class="btn" id="submitExamBtn">Submit exam</button>
      </div>
    </div>`;

  app.querySelectorAll('[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.qIndex = parseInt(btn.getAttribute('data-jump'), 10);
      state.screen = 'quiz';
      render(); window.scrollTo(0,0);
    });
  });
  document.getElementById('backToQuizBtn').addEventListener('click', () => {
    state.screen = 'quiz'; render(); window.scrollTo(0,0);
  });
  document.getElementById('submitExamBtn').addEventListener('click', () => {
    state.screen = 'results'; render(); window.scrollTo(0,0);
  });
  document.getElementById('pauseBtn2').addEventListener('click', () => {
    state.paused = true;
    state.pausedAt = Date.now();
    stopTimer();
    saveProgress();
    state.screen = 'quiz'; render();
  });
}

/* =========================================================
   REFERENCE LINKS — verified, real ServiceNow documentation/
   community pages, mapped by topic. Each was checked against a
   live search result before inclusion; none are fabricated.
   Applied only within the reasoning/explanation section, never
   in the question or option text itself.
   ========================================================= */
const DOC_LINKS = {
  DATA_MANAGER: { url: 'https://www.servicenow.com/docs/y7ZDgL2~MPpa35d88l6iIg', label: 'ServiceNow Docs — CMDB Data Manager' },
  LIFECYCLE_RULES: { url: 'https://www.servicenow.com/docs/r/xanadu/servicenow-platform/configuration-management-database-cmdb/life-cycle-rules-d66784e20263.html', label: 'ServiceNow Docs — Life-cycle rules & retirement definitions' },
  HEALTH_DASHBOARD: { url: 'https://www.servicenow.com/community/itsm-articles/understanding-cmdb-health/ta-p/2307033', label: 'ServiceNow Community — Understanding CMDB Health' },
  CI_CLASS_MANAGER: { url: 'https://www.servicenow.com/community/developer-forum/principal-class-cmdb/m-p/3418177', label: 'ServiceNow Community — Principal Class in CI Class Manager' },
  IRE_RECONCILIATION: { url: 'https://www.servicenow.com/docs/r/servicenow-platform/configuration-management-database-cmdb/c_CompsandProcessIDandReconcil.html', label: 'ServiceNow Docs — Identification & Reconciliation Engine (IRE)' },
  CMDB360: { url: 'https://www.servicenow.com/docs/r/xanadu/servicenow-platform/configuration-management-database-cmdb/multisource-cmdb.html', label: 'ServiceNow Docs — CMDB 360 / Multisource CMDB' },
  CSDM_OVERVIEW: { url: 'https://www.servicenow.com/products/it-operations-management/what-is-csdm.html', label: 'ServiceNow — What is CSDM?' },
  CSDM_REFERENCE: { url: 'https://www.servicenow.com/docs/r/servicenow-platform/common-service-data-model-csdm/csdm-content-frame-reference.html', label: 'ServiceNow Docs — CSDM Reference' },
  DISCOVERY: { url: 'https://www.servicenow.com/standard/resource-center/data-sheet/ds-discovery.html', label: 'ServiceNow — Discovery data sheet' },
  ACC: { url: 'https://www.servicenow.com/products/agent-client-collector.html', label: 'ServiceNow — Agent Client Collector' },
  SGC: { url: 'https://www.servicenow.com/products/service-graph-connectors.html', label: 'ServiceNow — Service Graph Connectors' },
  UNIFIED_MAP: { url: 'https://www.servicenow.com/docs/JG1HJIspS23EbhQh7mhQKQ', label: 'ServiceNow Docs — Unified Map' },
  CI_RELATIONSHIPS: { url: 'https://www.servicenow.com/docs/r/zurich/servicenow-platform/configuration-management-database-cmdb/c_CIRelationships.html', label: 'ServiceNow Docs — CI Relationships' },
  QUERY_BUILDER: { url: 'https://www.servicenow.com/community/cmdb-forum/a-deep-dive-into-servicenow-query-builder-and-unified-map-for/m-p/3493314', label: 'ServiceNow Community — CMDB Query Builder deep dive' },
};

function getDocLink(q) {
  const rules = [
    [/agent client collector|\bacc\b/, 'ACC'],
    [/service graph connector/, 'SGC'],
    [/cmdb 360|multisource/, 'CMDB360'],
    [/unified map/, 'UNIFIED_MAP'],
    [/query builder/, 'QUERY_BUILDER'],
    [/relationship type|runs on::runs|runs::runs|cmdb_rel_ci|many-to-many|one-to-many/, 'CI_RELATIONSHIPS'],
    [/principal class|ci class manager|basic info tab|attributes tab|\bderived\b tab|class upgrade|class downgrade|class switch|table inheritance|custom ci class|sn_cmdb_admin/, 'CI_CLASS_MANAGER'],
    [/identification rule|reconciliation|\bire\b|priority number/, 'IRE_RECONCILIATION'],
    [/life cycle mapping|life_cycle|life-cycle stage|csdm 5 domain|business capability|information object|business service|application service|technical service/, 'CSDM_REFERENCE'],
    [/csdm|crawl|walk stage|run stage|fly stage|maturity/, 'CSDM_OVERVIEW'],
    [/attestation|certification|retire|archive|delete polic|data manager/, 'DATA_MANAGER'],
    [/lifecycle polic|life-cycle polic|retirement definition/, 'LIFECYCLE_RULES'],
    [/completeness scorecard|correctness scorecard|compliance scorecard|health dashboard|duplicate ci\b|duplicate cis\b|duplicate record|duplicate metric|orphan ci\b|orphan cis\b|orphan rule|orphan metric|stale ci\b|stale cis\b|\bscorecard\b/, 'HEALTH_DASHBOARD'],
    [/\bdiscovery\b/, 'DISCOVERY'],
  ];
  // Pass 1: match against the question stem only, so a distractor mentioned
  // only in the explanation (e.g. "not ACC") can't hijack the topic.
  const qText = q.q.toLowerCase();
  for (const [re, key] of rules) if (re.test(qText)) return DOC_LINKS[key];
  // Pass 2: fall back to question + explanation combined.
  const fullText = qText + ' ' + q.explain.toLowerCase();
  for (const [re, key] of rules) if (re.test(fullText)) return DOC_LINKS[key];
  return null;
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);
}

function renderResults() {
  stopTimer();
  clearProgress();
  const set = EXAM_SETS[state.setKey];
  const total = set.questions.length;
  let score = 0;
  const domainTally = {};
  const reviewData = [];

  const reviewHtml = set.questions.map((q, i) => {
    const userAns = state.answers[i] || [];
    const correct = arraysEqual(userAns, q.correct);
    if (correct) score++;
    if (!domainTally[q.domain]) domainTally[q.domain] = { correct: 0, total: 0 };
    domainTally[q.domain].total++;
    if (correct) domainTally[q.domain].correct++;

    const userText = userAns.length ? userAns.map(idx => q.options[idx]).join('; ') : '(no answer)';
    const correctText = q.correct.map(idx => q.options[idx]).join('; ');
    const doc = getDocLink(q);
    const docHtml = doc ? `<div class="review-doclink"><a href="${doc.url}" target="_blank" rel="noopener">${doc.label} &#8599;</a></div>` : '';
    reviewData.push({ i, domain: q.domain, q: q.q, userText, correctText, correct, doc });

    return `
      <div class="review-item ${correct ? 'right' : 'wrong'}">
        <div class="review-head"><span>${q.domain}</span><span>Question ${i + 1} &middot; ${correct ? 'Correct' : 'Incorrect'}</span></div>
        <p class="review-q">${q.q}</p>
        <div class="review-ans"><span class="lbl">Your answer: </span><span class="val ${correct ? '' : 'wrong-val'}">${userText}</span></div>
        ${correct ? '' : `<div class="review-ans"><span class="lbl">Correct answer: </span><span class="val right-val">${correctText}</span></div>`}
        <div class="review-explain"><strong>Why: </strong>${q.explain}${docHtml}</div>
      </div>`;
  }).join('');

  setBest(state.setKey, score, total);
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 70;

  if (state.attemptId) {
    dbRecordFinish(state.attemptId, { score, total, pct, passed, domainTally });
    logEvent('completed', {
      attemptId: state.attemptId,
      firstName: state.registrant ? state.registrant.firstName : '',
      lastName: state.registrant ? state.registrant.lastName : '',
      email: state.registrant ? state.registrant.email : '',
      setName: set.name, score, total, pct,
      passFail: passed ? 'PASS' : 'FAIL',
      comments: domainSummary(domainTally),
    });
  }

  const domainRows = Object.entries(domainTally).map(([d, v]) => {
    const p = Math.round((v.correct / v.total) * 100);
    return `
      <div class="dscore-row">
        <div class="dlabel">${d}</div>
        <div class="dscore-track"><div class="dscore-fill" style="width:${p}%;background:${domainColor(d)}"></div></div>
        <div class="dscore-val">${v.correct}/${v.total}</div>
      </div>`;
  }).join('');

  const nameLine = state.registrant ? `<p style="color:var(--text-muted);margin:0 0 18px;">Results for ${state.registrant.firstName} ${state.registrant.lastName} (${state.registrant.email})</p>` : '';

  const registrantFullName = state.registrant ? (state.registrant.firstName + ' ' + state.registrant.lastName).trim() : '';

  app.innerHTML = `
    <div class="wrap" style="padding-top:36px;">
      ${nameLine}
      <div class="score-block">
        <div>
          <div class="score-num">${score}/${total}</div>
          <div class="score-pct">${pct}% &middot; pass mark is 70%</div>
        </div>
        <span class="badge ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'BELOW PASS MARK'}</span>
      </div>

      <div class="top-actions" style="margin-top:0; margin-bottom:28px;">
        <button class="btn secondary" id="downloadPdfBtn">Download results as PDF</button>
        <span id="downloadStatus" style="font-size:13px; color:var(--text-muted); align-self:center;"></span>
      </div>

      <h2 class="section-title">Score by domain</h2>
      <div class="domain-scores">${domainRows}</div>

      <div class="feedback-card" id="feedbackCard">
        <h2 style="margin:0 0 6px; font-size:18px;">Before you review the answers &mdash; how was this practice exam?</h2>
        <p style="color:var(--text-muted); font-size:13.5px; margin:0 0 4px;">Rate it, leave a comment if you like, then send it to the organizer. The detailed answer-by-answer review is right below this.</p>
        <div class="star-row" id="starRow">
          ${[1,2,3,4,5].map(n => `<button type="button" class="star-btn" data-star="${n}">&#9733;</button>`).join('')}
        </div>
        <textarea id="feedbackText" placeholder="Anything confusing, incorrect, or that could be improved? (optional)"></textarea>
        <div class="field" style="margin-top:12px; margin-bottom:0;">
          <label>Name</label>
          <input type="text" id="feedbackName" value="${registrantFullName}" placeholder="Name">
        </div>
        <div style="margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn" id="submitFeedbackBtn">Send feedback</button>
          <span id="feedbackStatus" style="font-size:13px; color:var(--text-muted);"></span>
        </div>
      </div>

      <h2 class="section-title">Full review &mdash; every question explained</h2>
      ${reviewHtml}

      <div class="top-actions">
        <button class="btn secondary" id="retakeBtn">Retake ${set.name}</button>
        <button class="btn" id="homeBtn">Choose another set</button>
      </div>
      <footer class="page-foot">CIS-DF Practice Exams &middot; created by Nithin Shubhananda for learning and self-testing purposes only &middot; not affiliated with ServiceNow</footer>
    </div>`;

  let starValue = 0;
  document.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      starValue = parseInt(btn.getAttribute('data-star'), 10);
      document.querySelectorAll('.star-btn').forEach(b => {
        b.classList.toggle('on', parseInt(b.getAttribute('data-star'), 10) <= starValue);
      });
    });
  });

  let downloadedFlag = false;

  document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('downloadStatus');
    if (typeof window.jspdf === 'undefined') {
      statusEl.textContent = 'PDF library did not load — try refreshing the page.';
      return;
    }
    statusEl.textContent = 'Preparing PDF…';
    try {
      const blob = buildResultsPDF({
        registrant: state.registrant, setName: set.name, score, total, pct, passed, domainTally, reviewData
      });
      const safeName = (state.registrant ? state.registrant.firstName + '-' + state.registrant.lastName : 'results').replace(/[^a-zA-Z0-9-]/g, '');
      const filename = `CIS-DF-${set.name.replace(/\s+/g,'')}-${safeName}.pdf`;

      if (downloadsNS) {
        // Running inside a Claude artifact viewer — use its native save prompt.
        const result = await downloadsNS.save({ filename, data: blob });
        statusEl.textContent = result.status === 'saved' ? 'Downloaded.' : 'Sent to your chosen destination.';
      } else {
        // Running as a standalone HTML file (or any browser outside Claude) —
        // fall back to a normal browser download, which needs no special capability.
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);
        statusEl.textContent = 'Downloaded.';
      }
      downloadedFlag = true;
      dbRecordDownload(state.attemptId);
      logEvent('downloaded', {
        attemptId: state.attemptId,
        firstName: state.registrant ? state.registrant.firstName : '',
        lastName: state.registrant ? state.registrant.lastName : '',
        email: state.registrant ? state.registrant.email : '',
        setName: set.name, score, total, pct,
        passFail: passed ? 'PASS' : 'FAIL',
        downloaded: 'Yes',
      });
    } catch (e) {
      if (e && e.code === 'declined') { statusEl.textContent = ''; }
      else { statusEl.textContent = 'Could not generate the download right now.'; }
    }
  });

  document.getElementById('submitFeedbackBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('feedbackStatus');
    const btn = document.getElementById('submitFeedbackBtn');
    const nameEntered = document.getElementById('feedbackName').value.trim();
    const nameParts = nameEntered.split(/\s+/);
    const firstName = nameParts[0] || (state.registrant ? state.registrant.firstName : '');
    const lastName = nameParts.slice(1).join(' ') || (state.registrant ? state.registrant.lastName : '');
    const comments = document.getElementById('feedbackText').value.trim();
    const email = state.registrant ? state.registrant.email : '';

    if (!starValue && !comments) {
      statusEl.textContent = 'Add a rating or a comment first.';
      return;
    }

    btn.disabled = true;
    statusEl.textContent = 'Sending…';

    // Best-effort: try the in-app database too, in case this viewer happens
    // to have access to it. The sheet logger is the one that actually
    // guarantees delivery, regardless of account or hosting.
    dbRecordFeedback({
      rating: starValue || null, comments: comments || null, firstName, lastName, email,
      setKey: state.setKey, setName: set.name, score, total, pct,
      visible: false, source: 'results', submittedAt: new Date().toISOString()
    });

    const ok = await logEvent('feedback', {
      attemptId: state.attemptId, firstName, lastName, email,
      setName: set.name, score, total, pct,
      passFail: passed ? 'PASS' : 'FAIL',
      downloaded: downloadedFlag ? 'Yes' : 'No',
      rating: starValue || '', comments,
    });

    if (ok) {
      statusEl.textContent = 'Thank you — sent.';
    } else {
      statusEl.textContent = 'Could not reach the log — please try again in a moment.';
      btn.disabled = false; // let them retry rather than stranding them on a false success
    }
  });

  document.getElementById('retakeBtn').addEventListener('click', () => {
    state.screen = 'register'; state.qIndex = 0; state.answers = new Array(total).fill(null); state.attemptId = null;
    render(); window.scrollTo(0,0);
  });
  document.getElementById('homeBtn').addEventListener('click', () => {
    state = { screen: 'landing', setKey: null, qIndex: 0, answers: [], registrant: null, attemptId: null };
    render(); window.scrollTo(0,0);
  });
}

/* ---------- Direct-link routing: ?set=set1 / set2 / set3 jumps straight to registration ---------- */
function renderResumePrompt(saved) {
  const set = EXAM_SETS[saved.setKey];
  const timeLeftNow = saved.pausedAt
    ? Math.max(0, Math.round((saved.examEndsAt - saved.pausedAt) / 1000))
    : Math.max(0, Math.round((saved.examEndsAt - Date.now()) / 1000));
  const expired = timeLeftNow <= 0;
  app.innerHTML = `
    <div class="wrap" style="padding-top:60px; text-align:center;">
      <div class="q-card" style="max-width:460px; margin:0 auto;">
        <h2 style="margin-top:0;">${expired ? 'Your previous exam timed out' : 'Resume your exam?'}</h2>
        <p style="color:var(--text-muted); font-size:14px; line-height:1.6;">
          ${expired
            ? `We found an in-progress attempt at ${set.name} for ${saved.registrant ? saved.registrant.firstName : 'you'}, but its 90-minute limit has passed. You can submit what was answered, or start a fresh attempt.`
            : `We found an in-progress attempt at <strong>${set.name}</strong> for ${saved.registrant ? saved.registrant.firstName : 'you'} &mdash; question ${saved.qIndex + 1} of ${set.questions.length}, with <strong>${formatTime(timeLeftNow)}</strong> left on the clock.`}
        </p>
        <div class="top-actions" style="margin-top:20px;">
          <button class="btn secondary" id="discardBtn">Start over</button>
          <button class="btn" id="resumeSavedBtn">${expired ? 'Submit as-is' : 'Resume exam'}</button>
        </div>
      </div>
    </div>`;

  document.getElementById('discardBtn').addEventListener('click', () => {
    clearProgress();
    pendingResume = null;
    state = { screen: 'landing', setKey: null, qIndex: 0, answers: [], registrant: null, attemptId: null };
    render();
  });
  document.getElementById('resumeSavedBtn').addEventListener('click', () => {
    pendingResume = null;
    state = {
      screen: expired ? 'results' : 'quiz',
      setKey: saved.setKey, qIndex: saved.qIndex,
      answers: saved.answers, flags: saved.flags,
      registrant: saved.registrant, attemptId: saved.attemptId,
      timeLeft: timeLeftNow, paused: false,
      examEndsAt: saved.examEndsAt, pausedAt: null
    };
    if (!expired) startTimer();
    render();
    window.scrollTo(0,0);
  });
}

let pendingResume = null;
(function initRoute() {
  const saved = loadProgress();
  if (saved && saved.setKey && EXAM_SETS[saved.setKey]) {
    pendingResume = saved;
    state.screen = 'resume-prompt';
    render();
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const setParam = params.get('set');
  if (setParam && EXAM_SETS[setParam]) {
    state = { screen: 'register', setKey: setParam, qIndex: 0, answers: [], registrant: null, attemptId: null };
  }
  render();
})();
</script>
</body>
</html>
